<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bookstore</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>Bookstore</h1>
  </header>

  <main>
    <section class="search-section" aria-label="Search books">
      <div class="search-bar">
        <input
          type="text"
          id="search-input"
          maxlength="100"
          placeholder="Search by title..."
          aria-label="Search books by title"
          autocomplete="off"
        />
        <button id="search-btn" aria-label="Search">&#128269;</button>
      </div>
    </section>

    <section aria-label="Search results">
      <div id="empty-state" class="empty-state" hidden>
        No books found matching your search. Try looking up another title!
      </div>
      <div id="results" class="results-grid"></div>
    </section>
  </main>

  <template id="book-card-template">
    <article class="book-card">
      <img class="book-cover" src="" alt="" />
      <div class="book-info">
        <h2 class="book-title"></h2>
        <p class="book-author"></p>
        <p class="book-price"></p>
        <button class="add-to-cart-btn" type="button">Add to Cart</button>
      </div>
    </article>
  </template>

  <script src="script.js"></script>
</body>
</html>
